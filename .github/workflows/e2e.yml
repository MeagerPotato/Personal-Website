name: E2E

# Real browsers (Chromium, WebKit, a phone-sized Chromium) against the real build, served by
# `wrangler dev` with the real headers: tests/e2e, `npm run e2e`.
#
# NOT the required check, on purpose. `verify` (ci.yml) is fast and deterministic and guards
# `main`; this job is slow, renders WebGL on the CPU (a runner has no GPU), and a browser can
# always have a bad day. A red run here is a reason to look, not a locked door.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The browsers, and the system libraries WebKit needs on Linux.
      - run: npx playwright install --with-deps chromium webkit

      # build -> playwright test (which starts its own `wrangler dev` on dist/)
      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
