name: CI

# One job, one command. `npm run verify` is the same thing everyone runs locally before a commit,
# so a green check here means exactly what a green run on a laptop means.
#
# Branch protection on `main` requires the check named `verify` (the job id below). Renaming the
# job means updating the protection rule: see docs/runbooks/cloudflare-setup.md.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # format:check -> lint -> astro check -> vitest -> build -> verify-dist
      - run: npm run verify
